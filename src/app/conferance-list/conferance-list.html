
<h1>Conferences</h1>

<div class="cards-container">
  @for (conf of conferances(); track conf.id) {
    <div class="card">
      <img
        src="https://images.unsplash.com/photo-1540575467063-178a50c2df87"
        alt="Conference"
      />

      <div class="card-content">
        <h2>{{ conf.title }}</h2>
        <p>📅 {{ conf.date }}</p>
        <p>📍 {{ conf.location }}</p>
      </div>

      <button [routerLink]="['/details', conf.id]">
        Details
      </button>

      <button (click)="deleteConferance(conf.id)">
        Delete
      </button>
    </div>
  }
</div>
